name: Runtime tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      models:
        description: Download release models and run full runtime checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python training/build_native.py
      - run: sh training/build_slumbot.sh bin/policy_server
      - if: inputs.models == true
        run: python scripts/install_artifacts.py
      - run: python -m pytest -q
      - if: inputs.models == true
        run: python scripts/doctor.py
