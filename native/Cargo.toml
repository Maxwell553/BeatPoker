[package]
name = "hu-solver"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
postflop-solver = { path = "../vendor/postflop-solver", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
lto = "thin"
codegen-units = 1
